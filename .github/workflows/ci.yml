name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Workspace (lint, config tests, types, app build)
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  contracts:
    name: Contracts (unit, fuzz, invariants)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - run: forge fmt --check --root contracts
      - run: forge build --root contracts
      - run: forge test --root contracts
        env:
          FOUNDRY_PROFILE: ci

  secrets:
    name: Candidate-tree secret checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pinned gitleaks with release checksum
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location -o gitleaks_8.30.1_linux_x64.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location -o checksums.txt https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: python3 scripts/check-secrets.py --gitleaks

  nav:
    name: NAV (math tests, lint, deterministic dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.7.21'
      - run: uv run --python 3.11 --no-project python -m unittest discover -s tests/nav -v
      - run: uv tool run ruff==0.16.6 check nav_engine/hb.py tests/nav
      - run: uv run --python 3.11 nav_engine/hb.py nav --dry-run
