name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Workspace (lint, config tests, types, empty app build)
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  contracts:
    name: Foundry scaffold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - run: forge fmt --check --root contracts
      - run: forge build --root contracts
      - name: Report checkpoint scope
        run: |
          echo 'Phase 1 contains the Foundry configuration and pinned dependencies only.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Contract implementation and the required test suite start in Phase 2.' >> "$GITHUB_STEP_SUMMARY"

  secrets:
    name: Candidate-tree secret checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned gitleaks with release checksum
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location -o gitleaks_8.30.1_linux_x64.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location -o checksums.txt https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: python3 scripts/check-secrets.py --gitleaks

  # Phase 2 adds actual Foundry tests; Phase 4 adds Python lint/tests and NAV
  # dry-run plus nav.yml. No placeholder financial run is counted as passing.
