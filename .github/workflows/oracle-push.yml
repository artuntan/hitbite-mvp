name: oracle-push

# Publish the computed NAV on chain: HBToken.setNAV(newNav, newReportedAUM, force).
#
# Why this workflow is manual and protected, and never on a schedule:
#   * It is the only workflow in the repository that uses a signing key. An oracle that can move
#     NAV unattended is precisely the failure mode the 5% rail exists to contain (SECURITY.md:
#     oracle manipulation), so a person names the date, reads the dry run and approves the
#     environment before anything is signed.
#   * The key lives in the "oracle" GitHub environment, not in repository secrets, so it is not
#     readable by any other workflow, by pull requests from forks, or by a compromised branch.
#   * The push is idempotent per valuation date, so an accidental re-run sends nothing.
#
# Configure the environment (Settings > Environments > "oracle"):
#   required reviewers  - at least one, so a second person approves every push
#   secret   ORACLE_PRIVATE_KEY   testnet key holding ORACLE_ROLE on HBToken
#                                 (a force push additionally needs DEFAULT_ADMIN_ROLE)
#   variable NAV_ENGINE_RPC_URL   JSON-RPC URL of the testnet
#   variable NAV_ENGINE_DEPLOYMENT  path to contracts/deployments/<chain>.json (HBToken address)
#
# Testnet only: `nav-engine push` refuses any known mainnet chain id before building a transaction.

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: "Valuation date (YYYY-MM-DD, UTC). Empty means today."
        required: false
        type: string
      force_reason:
        description: "Admin override reason. Non-empty sends force=true (DEFAULT_ADMIN_ROLE, bypasses the rail). Leave empty for a normal push."
        required: false
        type: string
      dry_run:
        description: "Read the chain and print the decision without sending."
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: oracle-push
  cancel-in-progress: false

jobs:
  push:
    name: setNAV (manual, protected environment)
    runs-on: ubuntu-latest
    environment: oracle
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install the engine
        working-directory: engine
        run: uv sync --frozen

      - name: Recompute the NAV for the valuation date (no key in this step)
        working-directory: engine
        env:
          INPUT_AS_OF: ${{ inputs.as_of }}
          NAV_ENGINE_RPC_URL: ${{ vars.NAV_ENGINE_RPC_URL }}
          NAV_ENGINE_DEPLOYMENT: ${{ vars.NAV_ENGINE_DEPLOYMENT }}
        run: |
          set -euo pipefail
          as_of="${INPUT_AS_OF:-$(date -u +%F)}"
          echo "Computing the NAV as of ${as_of}; the runner's copy is never committed."
          uv run nav-engine compute --as-of "${as_of}" --generated-at "${as_of}T06:00:00Z"

      - name: Push the NAV on chain
        working-directory: engine
        env:
          # The key exists only in this step, from the protected environment's secrets.
          ORACLE_PRIVATE_KEY: ${{ secrets.ORACLE_PRIVATE_KEY }}
          NAV_ENGINE_RPC_URL: ${{ vars.NAV_ENGINE_RPC_URL }}
          NAV_ENGINE_DEPLOYMENT: ${{ vars.NAV_ENGINE_DEPLOYMENT }}
          FORCE_REASON: ${{ inputs.force_reason }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(push --nav ../web/public/data/nav.json)
          if [ -n "${FORCE_REASON}" ]; then
            echo "::warning::Forced NAV update requested (DEFAULT_ADMIN_ROLE): ${FORCE_REASON}"
            args+=(--force --reason "${FORCE_REASON}")
          fi
          if [ "${DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi
          uv run nav-engine "${args[@]}"
