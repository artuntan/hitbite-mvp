name: nav-daily

# Recompute the NAV documents from the simulated reference book every morning and open a pull
# request with whatever changed (BUILD_PROMPT 6.4).
#
# Why a PR and never a push: the numbers a reviewer sees on the site are only ever merged by a
# human, and the diff is the daily record of what moved.
#
# This job holds no key. It reads the chain read-only through a public RPC (optional: set the
# repository variables below) and writes JSON. The only step in this repository that signs anything
# is oracle-push.yml, which is manual and gated on the protected "oracle" environment.
#
# Optional repository variables (Settings > Secrets and variables > Actions > Variables):
#   NAV_ENGINE_RPC_URL     read-only JSON-RPC URL of the testnet (e.g. https://sepolia.base.org)
#   NAV_ENGINE_DEPLOYMENT  path to contracts/deployments/<chain>.json for the HBToken address
# Unset, the engine computes the reference-book NAV and says in nav.json that the chain was skipped.
#
# Opening the PR needs "Allow GitHub Actions to create and approve pull requests" in
# Settings > Actions > General.

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:
    inputs:
      as_of:
        description: "Valuation date (YYYY-MM-DD, UTC). Empty means today."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nav-daily
  cancel-in-progress: false

jobs:
  compute:
    name: compute NAV and open a refresh PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install the engine
        working-directory: engine
        run: uv sync --frozen

      - name: Resolve the valuation date and a stable timestamp
        id: when
        env:
          INPUT_AS_OF: ${{ inputs.as_of }}
        run: |
          set -euo pipefail
          as_of="${INPUT_AS_OF:-$(date -u +%F)}"
          # Pin generated_at to 06:00 UTC of the valuation date so re-running the same day
          # produces byte-identical documents and therefore no empty PR.
          echo "as_of=${as_of}" >> "$GITHUB_OUTPUT"
          echo "generated_at=${as_of}T06:00:00Z" >> "$GITHUB_OUTPUT"

      - name: Compute the NAV documents (read-only, no key in this job)
        working-directory: engine
        env:
          NAV_ENGINE_RPC_URL: ${{ vars.NAV_ENGINE_RPC_URL }}
          NAV_ENGINE_DEPLOYMENT: ${{ vars.NAV_ENGINE_DEPLOYMENT }}
        run: |
          set -euo pipefail
          uv run nav-engine compute \
            --as-of "${{ steps.when.outputs.as_of }}" \
            --generated-at "${{ steps.when.outputs.generated_at }}"

      - name: Is there anything new to publish?
        id: diff
        run: |
          set -euo pipefail
          paths=(web/public/data engine/data/distributions.csv)
          if git diff --quiet -- "${paths[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The published JSON is unchanged; there is nothing to open a PR for."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- "${paths[@]}"
          fi

      - name: Open or update the refresh PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: |
            web/public/data/*.json
            engine/data/distributions.csv
          branch: nav-daily/refresh
          delete-branch: true
          commit-message: "chore(engine): refresh NAV data as of ${{ steps.when.outputs.as_of }}"
          title: "chore(engine): NAV refresh ${{ steps.when.outputs.as_of }}"
          labels: |
            nav-data
            automated
          body: |
            Automated run of `nav-engine compute --as-of ${{ steps.when.outputs.as_of }}`.

            - Simulated reference book; every document carries `simulated: true` and a `source_note`.
            - No key was used: this workflow only reads and writes JSON.
            - Publishing the on-chain NAV is a separate, manual step (`oracle-push.yml`, protected
              environment `oracle`). Merging this PR does not change anything on chain.

            Check `nav.json` -> `nav.usdc_6dec` against `nav()` on the explorer before merging.
