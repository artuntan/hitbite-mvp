[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
extra_output_files = ["metadata"]

[fmt]
line_length = 120
tab_width = 4

[fuzz]
runs = 512

[profile.ci.fuzz]
runs = 2048

[invariant]
runs = 128
depth = 64
fail_on_revert = true

[lint]
exclude_lints = ["mixed-case-function", "mixed-case-variable", "screaming-snake-case-immutable"]
ignore = ["test/**/*.sol"]

# Chain endpoints, deploy permissions and the v2 contract suite arrive in Phase 2.
# Cancun bytecode is compatible with the target's newer EVM baseline; local tests
# alone do not validate Arc's native-USDC behavior.
