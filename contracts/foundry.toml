[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
gas_reports = ["HBToken", "IdentityRegistry", "MockUSDC"]
fs_permissions = [{ access = "read-write", path = "./deployments" }]
extra_output_files = ["abi"]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
wrap_comments = true

[fuzz]
runs = 512
seed = "0x4869744269746531"

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[profile.ci]
fuzz = { runs = 2048 }
invariant = { runs = 256, depth = 96 }

[rpc_endpoints]
anvil = "${ANVIL_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532, url = "https://api-sepolia.basescan.org/api" }

[lint]
# `setNAV` / `reportedAUM` are the names mandated by SPEC.md and BUILD_PROMPT.md; partners integrate against them.
exclude_lints = ["mixed-case-function", "mixed-case-variable"]
# `src/` is linted in full. Test files are skipped: cheatcode idioms (`vm.expectEmit` + `emit`, `vm.expectRevert`
# on value-returning calls, `vm.warp` loops in fixtures) trip reentrancy-events / unused-return / calls-loop by
# construction and carry no production meaning.
ignore = ["test/**/*.sol"]
