# gitleaks configuration: default rules + allowlist for public fixtures.
[extend]
useDefault = true

[allowlist]
description = "Public, non-secret material"
paths = [
  '''contracts/lib/.*''',
  '''pnpm-lock\.yaml''',
  '''uv\.lock''',
  '''scripts/anvil-public-keys\.txt''',
  # Machine-written deployment records and the file generated from them. Their schema is fixed
  # (chainId, addresses, deployBlock, txHashes, timestamp) and neither the deploy script's
  # `record()` nor `sync-contracts.ts` can emit a key. scripts/check-secrets.sh still scans both.
  '''contracts/deployments/.*\.json''',
  '''web/lib/generated/addresses\.ts''',
]
regexes = [
  # An Ethereum address is 20 bytes of public data. A secp256k1 private key is 32 bytes, so a
  # 40-hex-digit string is the wrong length to be one: allowing this shape cannot hide a key.
  # gitleaks' generic-api-key rule flags addresses on entropy alone, which is what this answers.
  '''0x[0-9a-fA-F]{40}\b''',
  # A Solidity custom-error identifier from the generated ABI, quoted in a test. gitleaks'
  # generic-api-key rule scores long mixed-case identifiers on entropy and cannot tell one from a
  # token; this is a function name in a public interface, not a credential.
  '''ERC20InsufficientAllowance''',
  # Creation transaction hashes of the deterministic local Anvil deployment, quoted in
  # contracts/README.md. Public chain data. A tx hash and a private key are both 32 bytes, so these
  # are listed by value rather than by shape — add a line here when a new deployment is documented.
  '''5e8ed126a35a187a3706300d6b4cf231dbac1942d71b22aa74a11955811872cb''',
  '''655a04e5c450053f20ab76c44e188ab99c5cb97bf79f17b24134d82cc74b578d''',
  '''7cb11b44d2b9c6042e400eee24161d536c5c628680d0680f65055ea21d1c63bd''',
  # Anvil's ten published development private keys (Foundry docs); never used on a public network here.
  '''ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80''',
  '''59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d''',
  '''5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a''',
  '''7c852118294e51e653712a81e05800f419141751be58f605c371e15141b007a6''',
  '''47e179ec197488593b187f80a00eb0da91f1b9d0b13f8733639f19c30a34926a''',
  '''8b3a350cf5c34c9194ca85829a2df0ec3153be0318b5e2d3348e872092edffba''',
  '''92db14e403b83dfe3df233f83dfa3a0d7096f21ca9b0d6d6b8d88b2b4ec1564e''',
  '''4bbbf85ce3377467afe5d46f804f221813b2bb87f24d81f60f1fcdbf7cbf4356''',
  '''dbda1821b80551c9d65939329250298aa3472ba22feea921c0cf5d620ea67b97''',
  '''2a871d0798f97d79848a013d4936a73bf4cc922c825d33c1cf7073dff6d409c6''',
]
