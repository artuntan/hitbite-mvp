# NAV engine configuration (testnet, simulated data). See PLAN.md D19 and FIXTURE.md for conventions.
fund:
  name: "hbTRS — HitBite Türkiye Sovereign (Testnet)"
  currency: USD
  management_fee_pct_pa: 0.75      # accrues daily on the previous day's NAV_total, ACT/365F
  fund_expenses_pct_pa: 0.30       # simulated fund expenses, same accrual rule
  fee_day_count_basis: 365

nav:
  # Reference-unit model (D19): reference_units = NAV_total on inception_date, so unit NAV = 1.000000 at inception.
  # nav_per_token = NAV_total / reference_units, rounded HALF_UP to 6 decimals (USDC units).
  rounding: ROUND_HALF_UP
  decimals: 6
  price_carry_forward: true        # days without a price row reuse the last known clean price
  update_policy: "Daily at 06:00 UTC via nav-daily.yml; the oracle push is a separate manual, protected step."

oracle:
  max_move_bps: 500                # on-chain rail: setNAV reverts beyond ±5% unless an admin forces it
  force_requires_reason: true      # push_nav --force needs --reason, logged in the tx description

distribution_yield:
  trailing_months: 12              # annualised over the months actually available (reported alongside)

scenarios:
  parallel_shifts_bp: [-200, -100, -50, 50, 100, 200]
  cds:
    # Simplifying assumption, stated on every output: a CDS spread shock passes 1:1 into the USD yield curve
    # (beta = 1.0). Real pass-through varies with tenor and basis; this is illustrative.
    beta_to_yield: 1.0
    shocks_bp: [50, 100, 200]
    reference_5y_cds_bp: 217        # 31 Aug 2026 level cited in BUILD_PROMPT.md (context only)

comparison:
  # Parameterised reference for the Overview comparison card. Labelled illustrative in the UI.
  tokenized_tbill_reference:
    label: "Tokenized US T-bill reference (illustrative)"
    yield_pct: 4.00
    source_note: "Illustrative placeholder. Replace with a cited public yield before any external use."
