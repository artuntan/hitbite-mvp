[project]
name = "nav-engine"
version = "0.1.0"
description = "HitBite NAV, attestation and oracle engine (testnet, simulated data)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.3,<3",
    "numpy>=2,<3",
    "pydantic>=2.11,<3",
    "web3>=7.16,<8",
    "pyyaml>=6",
    "python-dotenv>=1",
]

[project.scripts]
nav-engine = "nav_engine.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
    "mypy",
    "pandas-stubs>=2.3,<3",
    "types-PyYAML",
]
# `notebooks/portfolio_analytics.ipynb` only. Deliberately NOT in the default groups, so
# `uv sync --frozen` in CI and on a contributor's first run stays as light as it is today;
# `make notebook` (or `uv run --group notebook ...`) pulls these in on demand.
notebook = [
    "ipykernel>=6.29",   # the kernel `nbconvert --execute` runs the notebook in
    "nbconvert>=7.16",   # notebook -> executed notebook, and notebook -> HTML
    "matplotlib>=3.9,<4",# figures; DejaVu Sans ships with it, so text renders identically anywhere
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nav_engine"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF"]
ignore = ["E501"] # line length is enforced by the formatter

[tool.ruff.format]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"  # summary of non-passing outcomes; do not set -q here, it hides the pass count
filterwarnings = [
    # web3 imports websockets.legacy; the warning is theirs, not ours.
    "ignore:websockets.legacy is deprecated:DeprecationWarning",
]
